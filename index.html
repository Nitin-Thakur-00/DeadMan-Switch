<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL | Command Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="bg-[#050505] flex flex-col items-center justify-center min-h-screen text-white overflow-hidden selection:bg-cyan-900 selection:text-cyan-100">

    <div id="lockScreen" class="fixed inset-0 bg-[#0a0a0a] z-[9999] flex flex-col items-center justify-center p-6 transition-opacity duration-500">
        
        <div class="mb-8 text-center">
            <h1 class="text-cyan-400 mb-2 tracking-[0.3em] font-mono text-xl md:text-2xl drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]">
                SENTINEL ACCESS REQUIRED
            </h1>
            <p class="text-[10px] text-gray-500 tracking-widest uppercase">
                ENCRYPTED TERMINAL LINK
            </p>
        </div>
        
        <input type="password" id="tokenInput" placeholder="ENTER MASTER TOKEN" 
               class="bg-[#111] border border-cyan-400/50 p-4 text-cyan-400 text-center mb-6 w-72 md:w-96 font-mono tracking-widest focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.4)] transition-all placeholder:text-cyan-900">
        
        <button onclick="unlockSentinel()" 
                class="border border-cyan-400 px-8 py-3 text-cyan-400 hover:bg-cyan-400 hover:text-black transition-all duration-300 font-bold tracking-[0.2em] uppercase text-sm">
            INITIALIZE HANDSHAKE
        </button>
        
        <p id="errorMsg" class="text-red-500 mt-6 font-mono text-xs tracking-tighter uppercase min-h-[20px] drop-shadow-[0_0_5px_rgba(239,68,68,0.5)]"></p>
    </div>

    <div class="command-box p-8 rounded-lg w-full max-w-md text-center relative z-10">
        
        <header class="mb-10">
            <h1 class="text-3xl font-bold tracking-[0.3em] uppercase text-gray-100">Sentinel <span class="text-cyan-400">v2.0</span></h1>
            <div id="connection-status" class="text-[10px] mt-2 text-gray-500 tracking-[0.1em] font-mono">
                ● AWAITING LINK...
            </div>
        </header>

        <div class="flex justify-center mb-14 relative">
            <button id="pulse-btn" class="pulse-circle w-32 h-32 rounded-full border border-cyan-400 flex items-center justify-center text-cyan-400 font-bold tracking-widest hover:bg-cyan-400/10 transition-colors relative">
                <span class="relative z-10">PULSE</span>
                <div class="pulse-ring absolute inset-0 rounded-full border border-cyan-400 opacity-0 pointer-events-none"></div>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-6 mb-10">
            <div class="stat-card bg-[#111] p-4 border border-gray-800 rounded">
                <label class="text-[10px] text-gray-500 tracking-widest block mb-2 font-mono">SYSTEM SWITCH</label>
                <button id="toggle-btn" class="status-off w-full py-2 font-bold tracking-wider border border-gray-700 text-gray-400 transition-all duration-300">
                    DISARMED
                </button>
            </div>
            
            <div class="stat-card bg-[#111] p-4 border border-gray-800 rounded flex flex-col justify-center">
                <label class="text-[10px] text-gray-500 tracking-widest block mb-1 font-mono">TIME TO LIVE</label>
                <div id="timer-display" class="text-2xl font-mono text-cyan-400 tracking-wider">
                    --:--:--
                </div>
            </div>
        </div>

        <div class="panic-container mt-4">
            <button id="panic-btn" class="panic-trigger w-full relative overflow-hidden py-4 border border-red-900/50 bg-red-950/20 text-red-500 font-bold uppercase tracking-[0.2em] transition-colors select-none">
                <span id="panic-text" class="relative z-10 pointer-events-none">HOLD 5s TO PURGE</span>
                <span id="panic-progress" class="absolute left-0 top-0 h-full bg-red-600/40 w-0 transition-none pointer-events-none"></span>
            </button>
            <p class="text-[9px] text-gray-600 mt-2 tracking-widest font-mono">WARNING: ACTION CANNOT BE UNDONE</p>
        </div>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
